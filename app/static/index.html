<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система учёта студентов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .container { max-width: 1200px; }
        .tab-content { background: white; padding: 20px; border: 1px solid #dee2e6; border-top: none; }
        .btn-sm { margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Система учёта студентов, предметов и оценок</h1>

        <!-- Навигационные вкладки -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="students-tab" data-bs-toggle="tab" data-bs-target="#students" type="button" role="tab">Студенты</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="subjects-tab" data-bs-toggle="tab" data-bs-target="#subjects" type="button" role="tab">Предметы</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="scores-tab" data-bs-toggle="tab" data-bs-target="#scores" type="button" role="tab">Оценки</button>
            </li>
        </ul>

        <!-- Содержимое вкладок -->
        <div class="tab-content" id="myTabContent">
            <!-- Вкладка Студенты -->
            <div class="tab-pane fade show active" id="students" role="tabpanel">
                <h3 class="mb-3">Студенты</h3>
                <button class="btn btn-primary mb-3" onclick="showAddStudentForm()">Добавить студента</button>
                <table class="table table-striped" id="studentsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Email</th>
                            <th>Группа</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Вкладка Предметы -->
            <div class="tab-pane fade" id="subjects" role="tabpanel">
                <h3 class="mb-3">Предметы</h3>
                <button class="btn btn-primary mb-3" onclick="showAddSubjectForm()">Добавить предмет</button>
                <table class="table table-striped" id="subjectsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Описание</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Вкладка Оценки -->
            <div class="tab-pane fade" id="scores" role="tabpanel">
                <h3 class="mb-3">Оценки</h3>
                <button class="btn btn-primary mb-3" onclick="showAddScoreForm()">Добавить оценку</button>
                <table class="table table-striped" id="scoresTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Студент</th>
                            <th>Предмет</th>
                            <th>Оценка</th>
                            <th>Дата</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальные окна для добавления/редактирования -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Заголовок</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="entityForm">
                        <input type="hidden" id="entityId">
                        <div id="formFields"></div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
